<!DOCTYPE html>
<html>
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="description" content="Ocean Notes - Flutter Web" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ocean Notes</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <style>
      html, body { height: 100%; }
      body { margin: 0; background: #f9fafb; font-family: Roboto, Arial, sans-serif; }
      #loading {
        height: 100%;
        display: grid;
        place-items: center;
        color: #111827;
      }
      .spinner {
        width: 42px; height: 42px; border-radius: 50%;
        border: 4px solid #dbeafe;
        border-top-color: #2563EB;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner" aria-label="Loading"></div>
    </div>
    <script src="flutter.js" defer></script>
    <script>
      window.addEventListener('load', function() {
        _flutter.loader.loadEntrypoint({}).then(function(engineInitializer) {
          return engineInitializer.initializeEngine();
        }).then(function(appRunner) {
          document.getElementById('loading')?.remove();
          return appRunner.runApp();
        });
      });
    </script>
  </body>
</html>
